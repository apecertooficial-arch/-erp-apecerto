<!doctype html>
<!-- @dsCard group="Spacing" name="Radii & shadows" subtitle="Corner radii (xs→pill) and warm-tinted soft shadow scale" viewport="700x270" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 26px 28px; }
  .section { margin-bottom: 22px; }
  .section:last-child { margin-bottom: 0; }
  .label-row { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .radius {
    height: 64px;
    background: var(--ape-orange-50);
    border: 1.5px solid var(--ape-orange);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ape-orange-700);
    font-weight: 600;
  }
  .shadow-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .shadow-box {
    background: #fff;
    border-radius: 14px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--fg-3);
    font-weight: 600;
  }
</style></head>
<body><div class="card">
  <div class="section">
    <div class="label-row">Corner radii</div>
    <div class="grid">
      <div class="radius" style="border-radius:4px;">xs · 4</div>
      <div class="radius" style="border-radius:8px;">sm · 8</div>
      <div class="radius" style="border-radius:12px;">md · 12</div>
      <div class="radius" style="border-radius:18px;">lg · 18</div>
      <div class="radius" style="border-radius:24px;">xl · 24</div>
      <div class="radius" style="border-radius:999px;">pill</div>
    </div>
  </div>
  <div class="section">
    <div class="label-row">Shadows · warm-tinted, soft</div>
    <div class="shadow-grid">
      <div class="shadow-box" style="box-shadow: var(--shadow-xs);">xs</div>
      <div class="shadow-box" style="box-shadow: var(--shadow-sm);">sm</div>
      <div class="shadow-box" style="box-shadow: var(--shadow-md);">md</div>
      <div class="shadow-box" style="box-shadow: var(--shadow-lg);">lg</div>
      <div class="shadow-box" style="box-shadow: var(--shadow-xl);">xl</div>
    </div>
  </div>
</div></body></html>
