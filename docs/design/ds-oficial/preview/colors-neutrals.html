<!doctype html>
<!-- @dsCard group="Colors" name="Warm neutral ramp" subtitle="10-step warm neutral, slightly off-white at the top, charcoal-brown at the bottom" viewport="700x170" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .step { height: 70px; border-radius: 10px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; }
  .step .n { font-size: 10px; font-weight: 700; font-family: var(--font-mono); }
  .step .h { font-size: 9px; font-family: var(--font-mono); opacity: 0.7; }
  .note { font-size: 12px; color: var(--fg-3); margin-top: 14px; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="step" style="background:var(--neutral-0);border:1px solid var(--border-soft);color:var(--fg-2);"><span class="n">0</span><span class="h">#FFFFFF</span></div>
    <div class="step" style="background:var(--neutral-50);color:var(--fg-2);"><span class="n">50</span><span class="h">#FAF8F6</span></div>
    <div class="step" style="background:var(--neutral-100);color:var(--fg-2);"><span class="n">100</span><span class="h">#F2EFEC</span></div>
    <div class="step" style="background:var(--neutral-200);color:var(--fg-2);"><span class="n">200</span><span class="h">#E4DFD9</span></div>
    <div class="step" style="background:var(--neutral-300);color:var(--fg-1);"><span class="n">300</span><span class="h">#C9C2BA</span></div>
    <div class="step" style="background:var(--neutral-400);color:#fff;"><span class="n">400</span><span class="h">#9A938B</span></div>
    <div class="step" style="background:var(--neutral-500);color:#fff;"><span class="n">500</span><span class="h">#6E6760</span></div>
    <div class="step" style="background:var(--neutral-600);color:#fff;"><span class="n">600</span><span class="h">#4D4842</span></div>
    <div class="step" style="background:var(--neutral-700);color:#fff;"><span class="n">700</span><span class="h">#332F2B</span></div>
    <div class="step" style="background:var(--neutral-800);color:#fff;"><span class="n">800</span><span class="h">#1F1C1A</span></div>
  </div>
  <div class="note">Warm neutral ramp — slightly off-white at the top, charcoal-brown (not gray) at the bottom. Tuned to harmonize with the orange brand color.</div>
</div></body></html>
