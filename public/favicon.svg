<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ApêCerto">
  <!-- Símbolo da marca: a casa é o "apê" (laranja) e o visto é o "certo"
       (roxo). Fundo branco, como pedido — o ícone precisa funcionar tanto na
       tela clara do Android quanto na escura do iPhone.

       O arquivo anterior era um ícone azul de blocos, de biblioteca. Não tinha
       relação nenhuma com a marca. -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <!-- Telhado e corpo da casa em traço grosso: o ícone precisa sobreviver a
       48px na gaveta do Android sem virar borrão. -->
  <path d="M118 232 256 118l138 114"
        fill="none" stroke="#FF7000" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M158 246v134a20 20 0 0 0 20 20h156a20 20 0 0 0 20-20V246"
        fill="none" stroke="#FF7000" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- O "certo": visto roxo dentro da casa. -->
  <path d="M204 316l38 38 74-78"
        fill="none" stroke="#8B00CC" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
