<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produtos — ApeCerto (proposta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF7000; --orange-600:#e65f00; --orange-soft:#fff3e8;
  --purple:#8B00CC; --purple-soft:#f7ebfd;
  --green:#17874e; --green-soft:#e8f7ef;
  --red:#c9443e; --red-soft:#fdeceb;
  --amber:#b07500; --amber-soft:#fff6e0;
  --page:#faf9f7; --surface:#fff; --sunken:#f5f2ef; --line:#ece7e2;
  --ink:#241f1b; --ink-soft:#5b544e; --muted:#8b827c;
  --r-card:16px; --r-btn:12px; --r-chip:999px;
  --sh-xs:0 1px 2px rgba(31,24,19,.05);
  --sh-sm:0 2px 8px rgba(31,24,19,.06);
  --sh-md:0 14px 32px rgba(31,24,19,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:Quicksand,system-ui,sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:0 28px 60px}

/* ---------- topo ---------- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:24px 0 18px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.topbar .sub{margin:5px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font-family:inherit;font-size:13px;font-weight:600;border-radius:var(--r-btn);height:42px;padding:0 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:.16s ease}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-sm)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(255,112,0,.24)}
.btn.primary:hover{background:var(--orange-600)}
.btn.purple{background:var(--purple);border-color:var(--purple);color:#fff}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:15px 16px;position:relative;overflow:hidden;box-shadow:var(--sh-xs)}
.kpi .bolha{position:absolute;right:-22px;top:-22px;width:76px;height:76px;border-radius:50%;opacity:.10}
.kpi .lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.kpi .val{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1;margin:0}
.kpi .hint{font-size:11.5px;color:var(--ink-soft);margin:6px 0 0;font-weight:500}
.kpi.act{cursor:pointer}.kpi.act:hover{transform:translateY(-1px);box-shadow:var(--sh-sm)}
.kpi.warn .val{color:var(--amber)} .kpi.warn .bolha{background:var(--amber)}
.kpi.o .val{color:var(--orange)} .kpi.o .bolha{background:var(--orange)}
.kpi.p .val{color:var(--purple)} .kpi.p .bolha{background:var(--purple)}
.kpi.g .val{color:var(--green)} .kpi.g .bolha{background:var(--green)}
.kpi.n .bolha{background:var(--ink)}

/* ---------- filtros ---------- */
.filtros{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin-bottom:20px;box-shadow:var(--sh-xs)}
.linha{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.linha+.linha{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.pill{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:var(--r-chip);padding:8px 15px;cursor:pointer;transition:.14s}
.pill:hover{border-color:#d8d1cb;color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.on.o{background:var(--orange);border-color:var(--orange)}
.pill.on.p{background:var(--purple);border-color:var(--purple)}
.busca{position:relative;flex:1;min-width:230px;max-width:340px}
.busca input{width:100%;height:40px;border:1px solid var(--line);border-radius:var(--r-btn);padding:0 14px 0 38px;font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
.busca input:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:transparent}
.busca span{position:absolute;left:14px;top:11px;color:var(--muted);font-size:15px}
select{height:40px;border:1px solid var(--line);border-radius:var(--r-btn);padding:0 12px;font-family:inherit;font-size:13px;font-weight:500;background:var(--surface);color:var(--ink-soft);cursor:pointer}
.cont{margin-left:auto;font-size:12px;font-weight:700;color:var(--orange);background:var(--orange-soft);border-radius:var(--r-chip);padding:8px 14px;white-space:nowrap}

/* ---------- grade ---------- */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--sh-xs);transition:.18s ease;cursor:pointer;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:#e3dcd5}
.foto{height:158px;position:relative;background:var(--sunken);overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.card:hover .foto img{transform:scale(1.05)}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 42%,rgba(0,0,0,.30) 100%)}
.semfoto{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#efe9e3,#e2dad2)}
.semfoto b{font-size:12px;font-weight:700;color:#a99e94;letter-spacing:.04em}

.selo{position:absolute;z-index:2;top:11px;left:11px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:5px 11px;border-radius:var(--r-chip);background:rgba(255,255,255,.95);color:var(--ink);backdrop-filter:blur(6px)}
.selo.lancamento{background:var(--purple);color:#fff}
.selo.em_obras{background:var(--amber-soft);color:var(--amber)}
.selo.pronto{background:var(--green-soft);color:var(--green)}
.estoque{position:absolute;z-index:2;top:11px;right:11px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:var(--r-chip);background:rgba(20,14,9,.62);color:#fff;backdrop-filter:blur(6px)}
.estoque.zero{background:rgba(201,68,62,.9)}
.alerta{position:absolute;z-index:2;bottom:11px;left:11px;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:var(--r-chip);background:var(--red);color:#fff}
.fotos-n{position:absolute;z-index:2;bottom:11px;right:11px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}

.corpo{padding:14px 15px 0;flex:1}
.faixa{font-size:17px;font-weight:700;color:var(--orange);letter-spacing:-.02em;line-height:1.15;margin:0 0 2px}
.faixa small{font-size:12px;font-weight:600;color:var(--ink-soft)}
.nome{margin:7px 0 3px;font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.local{margin:0;font-size:12px;color:var(--muted);font-weight:500}
.local b{color:var(--ink-soft);font-weight:600}
.tips{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 0}
.tips span{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:var(--r-chip);background:var(--sunken);color:var(--ink-soft)}
.area{margin:9px 0 0;font-size:11.5px;color:var(--ink-soft);font-weight:600}

.barra-wrap{padding:12px 15px 0}
.barra{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),#ff9a3d)}
.barra-lab{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;font-weight:600;color:var(--muted)}

.rodape{margin-top:12px;padding:11px 15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fdfcfb}
.m2{font-size:12px;font-weight:700;color:var(--purple)}
.m2 small{font-size:10.5px;color:var(--muted);font-weight:600;display:block;margin-top:1px}
.mini{font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-chip);padding:6px 12px;cursor:pointer;color:var(--ink-soft);font-family:inherit}
.mini:hover{border-color:var(--orange);color:var(--orange)}
.vazio{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-weight:600;font-size:14px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 14px 40px}}
</style></head><body>
<div class="wrap">
  <header class="topbar">
    <div><h1>Produtos</h1><p class="sub" id="sub">—</p></div>
    <div class="acts">

        <option value="nome">Ordenar: A–Z</option>
      </select>
      <span class="cont" id="cont">—</span>
    </div>
  </section>

  <section class="grade" id="grade"></section>
</div>

const opts = (el, arr, label) => { el.innerHTML = '<option value="">'+label+'</option>' + arr.map(v=>'<option>'+v+'</option>').join(""); };
opts(document.getElementById("bairro"), [...new Set(D.map(d=>d.b))].sort(), "Todos os bairros");
opts(document.getElementById("inc"), [...new Set(D.map(d=>d.inc).filter(x=>x&&x!=="—"))].sort(), "Todas as incorporadoras");

function kpis(){
  const un = D.reduce((a,d)=>a+d.disp,0);
  const vgv = D.reduce((a,d)=>a+(d.vgv||0),0);
  const semBook = D.filter(d=>d.mid===0).length;
  const semEstoque = D.filter(d=>d.disp===0).length;
  const conc = D.filter(d=>norm(d.b)==="moema").reduce((a,d)=>a+d.disp,0);
  document.getElementById("kpis").innerHTML = `
  <div class="kpi o"><span class="bolha"></span><p class="lab">Unidades disponíveis</p><p class="val">${un}</p><p class="hint">em ${D.filter(d=>d.disp>0).length} de ${D.length} produtos</p></div>
  <div class="kpi p"><span class="bolha"></span><p class="lab">VGV disponível</p><p class="val">${(vgv/1e6).toFixed(1).replace(".",",")} mi</p><p class="hint">soma do estoque em tabela</p></div>
  <div class="kpi g"><span class="bolha"></span><p class="lab">Ticket médio</p><p class="val">${kurto(vgv/un)}</p><p class="hint">por unidade disponível</p></div>
  <div class="kpi warn act" onclick="document.getElementById('fSemBook').click()"><span class="bolha"></span><p class="lab">Sem material</p><p class="val">${semBook}</p><p class="hint">produtos sem nenhuma foto ▸</p></div>
  <div class="kpi n"><span class="bolha"></span><p class="lab">Concentração Moema</p><p class="val">${Math.round(conc/un*100)}%</p><p class="hint">${semEstoque} produtos com estoque zerado</p></div>`;
}

function filtra(){
  let r = D.filter(d=>{
    if(S.st!=="Todos" && d.st!==S.st) return false;
    if(S.estoque && d.disp===0) return false;
    if(S.semBook && d.mid>0) return false;
    if(S.bairro && d.b!==S.bairro) return false;
    if(S.inc && d.inc!==S.inc) return false;
    if(S.preco){ const [a,b]=S.preco.split("-").map(Number); if(d.pmin==null||d.pmin<a||d.pmin>b) return false; }
    if(S.q){ const q=norm(S.q); if(!norm(d.n).includes(q) && !norm(d.b).includes(q) && !norm(d.inc).includes(q)) return false; }
    return true;
  });
  const o=S.ord;
  r.sort((a,b)=> o==="nome" ? a.n.localeCompare(b.n) : o==="pmin" ? (a.pmin??9e15)-(b.pmin??9e15) : (b[o]||0)-(a[o]||0));
  return r;
}

function card(d){
  const pct = d.tot ? Math.round(d.disp/d.tot*100) : 0;
  const m2 = (d.pmin && d.amin) ? Math.round(d.pmin/d.amin) : null;
  const faixa = d.pmin==null ? '<p class="faixa">Sob consulta</p>'
    : d.pmin===d.pmax ? `<p class="faixa">${brl(d.pmin)}</p>`
    : `<p class="faixa">${kurto(d.pmin)} <small>a</small> ${kurto(d.pmax)}</p>`;
  const area = d.amin==null ? "" : d.amin===d.amax ? `${d.amin} m²` : `${d.amin} – ${d.amax} m²`;
  return `<article class="card">
    <div class="foto">
      ${d.capaUrl ? `<img src="${d.capaUrl}" alt="" loading="lazy" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;semfoto&quot;><b>IMAGEM NAO CARREGOU</b></div>')">`
                  : `<div class="semfoto"><b>SEM MATERIAL</b></div>`}
      <span class="selo ${d.st}">${{lancamento:"Lançamento",em_obras:"Em obras",pronto:"Pronto"}[d.st]||d.st}</span>
      <span class="estoque ${d.disp===0?"zero":""}">${d.disp===0?"Esgotado":d.disp+" disp."}</span>
      ${d.alerta?`<span class="alerta">⚠ ${d.alerta}</span>`:""}
      ${d.mid>0?`<span class="fotos-n">▣ ${d.mid}</span>`:""}
    </div>
    <div class="corpo">
      ${faixa}
      <h2 class="nome">${d.n}</h2>
      <p class="local">⌖ ${d.b} · <b>${d.inc}</b></p>
      ${d.tip?`<div class="tips">${d.tip.slice(0,4).map(t=>`<span>${t}</span>`).join("")}</div>`:""}
      ${area?`<p class="area">▭ ${area}</p>`:""}
    </div>
    <div class="barra-wrap">
      <div class="barra"><i style="width:${pct}%"></i></div>
      <div class="barra-lab"><span>${d.disp} de ${d.tot} unidades</span><span>${pct}%</span></div>
    </div>
    <div class="rodape">
      <div class="m2">${m2?brl(m2)+"/m²":"—"}<small>a partir de</small></div>
      <button class="mini">Abrir ficha ▸</button>
    </div>
  </article>`;
}

function render(){
  const r = filtra();
  document.getElementById("grade").innerHTML = r.length ? r.map(card).join("") : '<p class="vazio">Nenhum produto com esses filtros.</p>';
  document.getElementById("cont").textContent = r.length + (r.length===1?" produto":" produtos");
  document.getElementById("sub").textContent = D.length+" empreendimentos · "+D.reduce((a,d)=>a+d.disp,0)+" unidades em estoque";
}

document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-st]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); S.st=b.dataset.st; render();
});
const tog=(id,k,cls)=>{const el=document.getElementById(id);el.onclick=()=>{S[k]=!S[k];el.classList.toggle("on");el.classList.toggle(cls);render();}};
tog("fEstoque","estoque","o"); tog("fSemBook","semBook","o"); tog("fFav","fav","p");
document.getElementById("q").oninput=e=>{S.q=e.target.value;render()};
["bairro","inc","preco","ord"].forEach(id=>document.getElementById(id).onchange=e=>{S[id]=e.target.value;render()});

kpis(); render();
</script></body></html>
