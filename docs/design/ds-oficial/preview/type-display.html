<!doctype html>
<!-- @dsCard group="Type" name="Display — wordmark" subtitle="Quicksand Bold, two-color apêcerto wordmark" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px 32px; background: var(--bg-page); }
  .display {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 96px;
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: var(--fg-1);
  }
  .ape   { color: var(--ape-orange); }
  .certo { color: var(--ape-purple); }
  .sub {
    margin-top: 14px;
    font-size: 14px;
    color: var(--fg-3);
    display: flex;
    gap: 16px;
    font-family: var(--font-mono);
  }
  .sub b { color: var(--fg-1); font-family: var(--font-body); font-weight: 600; }
</style></head>
<body><div class="card">
  <div class="display"><span class="ape">apê</span><span class="certo">certo</span></div>
  <div class="sub">
    <span><b>Quicksand</b> Bold 700</span>
    <span>−0.03em</span>
    <span>lowercase</span>
    <span>two-color wordmark</span>
  </div>
</div></body></html>
