<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base, 12 tokens from 4px to 96px" viewport="700x350" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 28px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 6px 0; }
  .row .name { width: 60px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .row .px { width: 50px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .row .bar { height: 14px; background: var(--ape-orange); border-radius: 4px; }
  .legend { font-size: 12px; color: var(--fg-3); margin-top: 14px; line-height: 1.5; }
</style></head>
<body><div class="card">
  <div class="row"><span class="name">space-1</span><span class="px">4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="name">space-2</span><span class="px">8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="name">space-3</span><span class="px">12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="name">space-4</span><span class="px">16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="name">space-5</span><span class="px">20px</span><div class="bar" style="width:20px"></div></div>
  <div class="row"><span class="name">space-6</span><span class="px">24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="name">space-8</span><span class="px">32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="name">space-10</span><span class="px">40px</span><div class="bar" style="width:40px"></div></div>
  <div class="row"><span class="name">space-12</span><span class="px">48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="name">space-16</span><span class="px">64px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="name">space-20</span><span class="px">80px</span><div class="bar" style="width:80px"></div></div>
  <div class="row"><span class="name">space-24</span><span class="px">96px</span><div class="bar" style="width:96px"></div></div>
  <div class="legend">4px base. Use 4–6 inside components, 8–12 between siblings, 16–24 between groups, 64–96 between marketing sections.</div>
</div></body></html>
