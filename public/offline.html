<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sem conexao — ApeCerto</title>
<style>
  :root { --laranja:#ff6500; --tinta:#1d1d1f; --suave:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--tinta); background:#f6f7f9; }
  .caixa { max-width:360px; text-align:center; }
  img { width:72px; height:72px; margin-bottom:20px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--suave); margin:0 0 24px; }
  button { width:100%; padding:14px 20px; font-size:16px; font-weight:600; color:#fff;
           background:var(--laranja); border:0; border-radius:12px; cursor:pointer; }
</style>
</head>
<body>
  <div class="caixa">
    <img src="/icons/icone-192-v6.png" alt="ApeCerto" />
    <h1>Voce esta sem internet</h1>
    <p>Assim que o sinal voltar, seus clientes aparecem de novo. Nada foi perdido.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
