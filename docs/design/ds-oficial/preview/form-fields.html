<!doctype html>
<!-- @dsCard group="Components" name="Form fields" subtitle="Inputs (default, focus, error), select, checkboxes" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--fg-1); }
  .input {
    font-family: var(--font-body);
    font-size: 15px;
    padding: 12px 16px;
    border: 1.5px solid var(--border-default);
    border-radius: 12px;
    background: #fff;
    color: var(--fg-1);
    outline: none;
  }
  .input::placeholder { color: var(--fg-muted); }
  .input.focused {
    border-color: var(--ape-orange);
    box-shadow: 0 0 0 3px rgba(255, 112, 0, 0.18);
  }
  .input.error {
    border-color: var(--danger);
  }
  .hint { font-size: 12px; color: var(--fg-3); }
  .err { font-size: 12px; color: var(--danger); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .select {
    appearance: none;
    background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%234D4842' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 16px center;
    padding-right: 40px;
  }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fg-1); }
  .check .box {
    width: 20px; height: 20px;
    border-radius: 6px;
    background: var(--ape-orange);
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
</style></head>
<body><div class="card">
  <div class="row2">
    <div class="field">
      <label>Bairro</label>
      <input class="input" placeholder="Moema, Vila Mariana…" />
    </div>
    <div class="field">
      <label>Aluguel até</label>
      <select class="input select"><option>R$ 5.000</option></select>
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label>E-mail</label>
      <input class="input focused" value="ana@apecerto.com" />
      <span class="hint">Focus · orange ring 18%</span>
    </div>
    <div class="field">
      <label>Telefone</label>
      <input class="input error" value="11 98765" />
      <span class="err">Faltam 4 dígitos</span>
    </div>
  </div>
  <div class="row" style="display:flex; gap:18px; padding-top:4px;">
    <span class="check"><span class="box">✓</span> Mobiliado</span>
    <span class="check"><span class="box" style="background:#fff;border:1.5px solid var(--border-default);color:transparent;">·</span> Pet friendly</span>
    <span class="check"><span class="box" style="background:var(--ape-purple)">✓</span> Pronto pra entrar</span>
  </div>
</div></body></html>
