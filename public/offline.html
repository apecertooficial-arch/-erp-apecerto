<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sem conexao — ApeCerto</title>
<style>
  :root { --laranja:#ff6500; --tinta:#1d1d1f; --suave:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--tinta); background:#f6f7f9; }
  .caixa { max-width:360px; text-align:center; }
  img { width:72px; height:72px; margin-bottom:20px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--suave); margin:0 0 24px; }
  button { width:100%; padding:14px 20px; font-size:16px; font-weight:600; color:#fff;
           background:var(--laranja); border:0; border-radius:12px; cursor:pointer; }
  button:disabled { opacity:.72; cursor:wait; }
  #estado { min-height:21px; margin:12px 0 0; font-size:13px; }
</style>
</head>
<body>
  <div class="caixa">
    <img src="/icons/icone-192-v6.png" alt="ApeCerto" />
    <h1>Não foi possível conectar ao ApeCerto</h1>
    <p>A rede pode ter oscilado por alguns segundos. Vamos reconectar automaticamente. Nada foi perdido.</p>
    <button id="tentar" type="button">Tentar de novo</button>
    <p id="estado" role="status" aria-live="polite"></p>
  </div>
  <script>
    const botao = document.getElementById("tentar");
    const estado = document.getElementById("estado");
    let verificando = false;

    async function tentarDeNovo() {
      if (verificando) return;
      verificando = true;
      botao.disabled = true;
      botao.textContent = "Reconectando…";
      estado.textContent = "Verificando a conexão…";
      try {
        const resposta = await fetch(`/api/build?recuperar=${Date.now()}`, { cache: "no-store" });
        if (!resposta.ok) throw new Error("servidor_indisponivel");
        estado.textContent = "Conexão restabelecida.";
        location.reload();
      } catch {
        estado.textContent = "Ainda não foi possível conectar. Tentaremos novamente.";
        botao.disabled = false;
        botao.textContent = "Tentar de novo";
      } finally {
        verificando = false;
      }
    }

    botao.addEventListener("click", tentarDeNovo);
    window.addEventListener("online", tentarDeNovo);
    setInterval(tentarDeNovo, 5000);
  </script>
</body>
</html>
