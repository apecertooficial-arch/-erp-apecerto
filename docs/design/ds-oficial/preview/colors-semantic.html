<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success / warning / danger / info with listing-status labels" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .item { border-radius: 12px; padding: 14px; min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; }
  .item .label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .item .name { font-weight: 600; font-size: 14px; }
  .item .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; margin-top: 2px; }
  .dot { width: 24px; height: 24px; border-radius: 50%; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="item" style="background:var(--success-bg);">
      <div class="dot" style="background:var(--success);"></div>
      <div>
        <div class="label" style="color:var(--success);">success</div>
        <div class="name" style="color:var(--success);">Disponível</div>
        <div class="hex" style="color:var(--success);">#1FA85A</div>
      </div>
    </div>
    <div class="item" style="background:var(--warning-bg);">
      <div class="dot" style="background:var(--warning);"></div>
      <div>
        <div class="label" style="color:#9c6a14;">warning</div>
        <div class="name" style="color:#9c6a14;">Reservado</div>
        <div class="hex" style="color:#9c6a14;">#F2A82C</div>
      </div>
    </div>
    <div class="item" style="background:var(--danger-bg);">
      <div class="dot" style="background:var(--danger);"></div>
      <div>
        <div class="label" style="color:var(--danger);">danger</div>
        <div class="name" style="color:var(--danger);">Vendido</div>
        <div class="hex" style="color:var(--danger);">#D93E3E</div>
      </div>
    </div>
    <div class="item" style="background:var(--info-bg);">
      <div class="dot" style="background:var(--info);"></div>
      <div>
        <div class="label" style="color:var(--info);">info</div>
        <div class="name" style="color:var(--info);">Novidade</div>
        <div class="hex" style="color:var(--info);">#8B00CC</div>
      </div>
    </div>
  </div>
</div></body></html>
