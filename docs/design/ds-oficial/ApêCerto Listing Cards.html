document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head><meta charset=\"utf-8\"><style>/* Shared styles for design system preview cards.\n   Each card is sized 700×N, no titles (asset name shows outside). */\n/* ============================================\n   ApêCerto Design System — Colors & Type\n   ============================================ */\n\n/* ---------- Fonts ---------- */\n@font-face {\n  font-family: 'Quicksand';\n  src: url(\"aad1baf0-57c1-4974-87ec-fa47f3e5af14\") format('truetype');\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Quicksand';\n  src: url(\"02ba1a7a-da69-4496-bf45-642176cd184d\") format('truetype');\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Quicksand';\n  src: url(\"b35c35d9-1589-4084-b1ad-d8003507007d\") format('truetype');\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Quicksand';\n  src: url(\"9b6e55b2-7527-4f58-86bf-23cc60383204\") format('truetype');\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Quicksand';\n  src: url(\"2900aaa5-1c04-4748-8cbf-049b1d2835d0\") format('truetype');\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ============================\n     BRAND COLORS — Primary\n     ============================ */\n  --ape-orange:        #FF7000;   /* apê — house, primary action, energy */\n  --ape-orange-600:    #E66200;   /* hover/press of orange */\n  --ape-orange-700:    #CC5800;   /* active/press deep */\n  --ape-orange-300:    #FF9A4D;   /* hover lighten / illustrative */\n  --ape-orange-100:    #FFE4D1;   /* surface tint, badges bg */\n  --ape-orange-50:     #FFF3EA;   /* lightest tint, page accents */\n\n  --ape-purple:        #8B00CC;   /* certo — checkmark, secondary key */\n  --ape-purple-600:    #7A00B3;   /* hover */\n  --ape-purple-700:    #66009A;   /* active/press */\n  --ape-purple-300:    #B24DDD;   /* lighter purple, illustrative */\n  --ape-purple-100:    #EBD1F5;   /* tint bg */\n  --ape-purple-50:     #F7ECFC;   /* lightest tint */\n\n  /* ============================\n     NEUTRALS — warm, slightly off-white\n     ============================ */\n  --neutral-0:    #FFFFFF;\n  --neutral-50:   #FAF8F6;   /* page bg, sand-white */\n  --neutral-100:  #F2EFEC;   /* card bg, divider zones */\n  --neutral-200:  #E4DFD9;   /* dividers, input borders */\n  --neutral-300:  #C9C2BA;   /* disabled, secondary borders */\n  --neutral-400:  #9A938B;   /* placeholder text */\n  --neutral-500:  #6E6760;   /* muted body */\n  --neutral-600:  #4D4842;   /* body */\n  --neutral-700:  #332F2B;   /* headings */\n  --neutral-800:  #1F1C1A;   /* strong headings */\n  --neutral-900:  #100E0D;   /* black-on-warm */\n\n  /* ============================\n     SEMANTIC — foreground / background\n     ============================ */\n  --fg-1:        var(--neutral-800);   /* primary text */\n  --fg-2:        var(--neutral-600);   /* secondary text */\n  --fg-3:        var(--neutral-500);   /* tertiary / labels */\n  --fg-muted:    var(--neutral-400);   /* placeholder */\n  --fg-inverse:  var(--neutral-0);     /* text on dark/brand bg */\n  --fg-brand:    var(--ape-orange);    /* default brand fg */\n  --fg-accent:   var(--ape-purple);    /* accent brand fg */\n\n  --bg-page:     var(--neutral-50);    /* default page bg */\n  --bg-surface:  var(--neutral-0);     /* card surface */\n  --bg-raised:   var(--neutral-0);     /* elevated card */\n  --bg-sunken:   var(--neutral-100);   /* recessed area */\n  --bg-tint-orange: var(--ape-orange-50);\n  --bg-tint-purple: var(--ape-purple-50);\n\n  --border-soft:    var(--neutral-200);\n  --border-default: var(--neutral-300);\n  --border-strong:  var(--neutral-700);\n  --border-brand:   var(--ape-orange);\n\n  /* ============================\n     SEMANTIC — feedback\n     ============================ */\n  --success:        #1FA85A;\n  --success-bg:     #E4F6EC;\n  --warning:        #F2A82C;\n  --warning-bg:     #FDF1D9;\n  --danger:         #D93E3E;\n  --danger-bg:      #FBE5E5;\n  --info:           var(--ape-purple);\n  --info-bg:        var(--ape-purple-50);\n\n  /* ============================\n     TYPE — family, weights, sizes\n     ============================ */\n  --font-display: 'Quicksand', 'Quicksand Fallback', system-ui, -apple-system, sans-serif;\n  --font-body:    'Quicksand', 'Quicksand Fallback', system-ui, -apple-system, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n\n  --weight-light:    300;\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* Type scale (1.25 ratio, comfortable for marketing + product) */\n  --text-xs:    12px;\n  --text-sm:    14px;\n  --text-base:  16px;\n  --text-md:    18px;\n  --text-lg:    20px;\n  --text-xl:    24px;\n  --text-2xl:   30px;\n  --text-3xl:   38px;\n  --text-4xl:   48px;\n  --text-5xl:   60px;\n  --text-6xl:   76px;\n  --text-7xl:   96px;\n\n  --leading-tight:  1.1;\n  --leading-snug:   1.25;\n  --leading-normal: 1.45;\n  --leading-relaxed:1.6;\n\n  --tracking-tight:  -0.02em;\n  --tracking-snug:   -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.12em;\n\n  /* ============================\n     SPACING — 4px base\n     ============================ */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ============================\n     RADII — friendly, rounded\n     ============================ */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   12px;\n  --radius-lg:   18px;     /* cards */\n  --radius-xl:   24px;     /* feature cards / sheets */\n  --radius-2xl:  32px;\n  --radius-pill: 999px;    /* buttons, chips, tags */\n\n  /* ============================\n     SHADOWS — soft, warm\n     ============================ */\n  --shadow-xs:   0 1px 2px rgba(31, 28, 26, 0.04);\n  --shadow-sm:   0 2px 6px rgba(31, 28, 26, 0.06);\n  --shadow-md:   0 8px 20px rgba(31, 28, 26, 0.08);\n  --shadow-lg:   0 16px 40px rgba(31, 28, 26, 0.10);\n  --shadow-xl:   0 24px 60px rgba(31, 28, 26, 0.14);\n  --shadow-brand:0 12px 28px rgba(255, 112, 0, 0.28);\n  --shadow-accent:0 12px 28px rgba(139, 0, 204, 0.24);\n\n  /* ============================\n     MOTION\n     ============================ */\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);\n\n  --dur-fast:   120ms;\n  --dur-base:   200ms;\n  --dur-slow:   360ms;\n\n  /* ============================\n     LAYOUT\n     ============================ */\n  --container:      1200px;\n  --container-wide: 1440px;\n  --gutter:         24px;\n}\n\n/* ============================\n   SEMANTIC TEXT STYLES\n   ============================ */\nbody {\n  font-family: var(--font-body);\n  font-weight: var(--weight-regular);\n  color: var(--fg-1);\n  background: var(--bg-page);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, .h1 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold);\n  font-size: var(--text-5xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg-1);\n}\n\nh2, .h2 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold);\n  font-size: var(--text-3xl);\n  line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-snug);\n  color: var(--fg-1);\n}\n\nh3, .h3 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-2xl);\n  line-height: var(--leading-snug);\n  color: var(--fg-1);\n}\n\nh4, .h4 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-xl);\n  line-height: var(--leading-snug);\n  color: var(--fg-1);\n}\n\nh5, .h5 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-md);\n  line-height: var(--leading-snug);\n  color: var(--fg-1);\n}\n\np, .body {\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--fg-2);\n}\n\n.lead {\n  font-size: var(--text-lg);\n  line-height: var(--leading-relaxed);\n  color: var(--fg-2);\n  font-weight: var(--weight-regular);\n}\n\n.small, small {\n  font-size: var(--text-sm);\n  line-height: var(--leading-normal);\n  color: var(--fg-3);\n}\n\n.caption {\n  font-size: var(--text-xs);\n  line-height: var(--leading-normal);\n  color: var(--fg-3);\n}\n\n.eyebrow {\n  font-size: var(--text-xs);\n  font-weight: var(--weight-semibold);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--ape-orange);\n}\n\ncode, .mono {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\n\n/* Brand pair helper — for inline \"apêcerto\" wordmark style */\n.brand-ape   { color: var(--ape-orange); }\n.brand-certo { color: var(--ape-purple); }\n\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body {\n  width: 700px;\n  font-family: var(--font-body);\n  color: var(--fg-1);\n  background: var(--bg-page);\n  overflow: hidden;\n}\n.card {\n  padding: 24px;\n}\n.row { display: flex; gap: 12px; }\n.col { display: flex; flex-direction: column; gap: 12px; }\n.label {\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\n.mono {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  color: var(--fg-3);\n}\n.swatch {\n  flex: 1;\n  height: 96px;\n  border-radius: 14px;\n  padding: 10px 12px;\n  display: flex;\n  flex-direction: column;\n  justify-content: flex-end;\n  position: relative;\n  overflow: hidden;\n}\n.swatch .name { font-weight: 600; font-size: 13px; }\n.swatch .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }\n.swatch.border { border: 1px solid var(--border-soft); }\n<\u002Fstyle>\n\n<style>\n  html, body { background: var(--bg-page); }\n  .card { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n  .listing {\n    background: #fff;\n    border-radius: 18px;\n    box-shadow: var(--shadow-sm);\n    overflow: hidden;\n    position: relative;\n  }\n  .listing .photo {\n    height: 150px;\n    background: linear-gradient(135deg, #d8c9b8 0%, #b89a7a 100%);\n    position: relative;\n  }\n  .listing .photo.alt {\n    background: linear-gradient(135deg, #c4b5d4 0%, #8b7aa3 100%);\n  }\n  .listing .photo::after {\n    content: \"\"; position: absolute; inset: 0;\n    background: linear-gradient(180deg, transparent 60%, rgba(31, 28, 26, 0.45) 100%);\n  }\n  .badge-row {\n    position: absolute; top: 12px; left: 12px; right: 12px;\n    display: flex; justify-content: space-between; align-items: flex-start;\n    z-index: 2;\n  }\n  .badge {\n    padding: 5px 10px;\n    border-radius: 999px;\n    font-size: 11px;\n    font-weight: 700;\n    background: var(--ape-orange);\n    color: #fff;\n  }\n  .heart {\n    width: 32px; height: 32px;\n    border-radius: 50%;\n    background: rgba(255,255,255,0.95);\n    display: inline-flex; align-items: center; justify-content: center;\n    color: var(--neutral-600);\n  }\n  .heart.on { color: var(--ape-orange); }\n  .body { padding: 14px 16px 16px; }\n  .price { font-weight: 700; font-size: 18px; color: var(--fg-1); }\n  .price small { font-size: 12px; font-weight: 500; color: var(--fg-3); }\n  .title { font-size: 14px; font-weight: 600; margin-top: 4px; color: var(--fg-1); }\n  .addr { font-size: 12px; color: var(--fg-3); margin-top: 4px; display: inline-flex; align-items: center; gap: 5px; }\n  .specs { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--fg-2); font-weight: 500; padding-top: 10px; border-top: 1px solid var(--border-soft); }\n  .specs span { display: inline-flex; align-items: center; gap: 5px; }\n  .tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }\n  .tag { padding: 3px 9px; border-radius: 999px; font-size: 10px; font-weight: 600; }\n  .tag-orange { background: var(--ape-orange-100); color: var(--ape-orange-700); }\n  .tag-purple { background: var(--ape-purple-100); color: var(--ape-purple-700); }\n\n  /* Icon system — Lucide-style monoline */\n  .icn {\n    width: 14px;\n    height: 14px;\n    stroke: currentColor;\n    stroke-width: 2;\n    fill: none;\n    stroke-linecap: round;\n    stroke-linejoin: round;\n    flex-shrink: 0;\n  }\n  .icn-lg { width: 16px; height: 16px; }\n<\u002Fstyle><\u002Fhead>\n<body><div class=\"card\">\n  <div class=\"listing\">\n    <div class=\"photo\">\n      <div class=\"badge-row\">\n        <span class=\"badge\">Pronto pra morar<\u002Fspan>\n        <span class=\"heart\">\n          <svg class=\"icn icn-lg\" viewBox=\"0 0 24 24\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <div class=\"price\">R$ 4.200<small> /mês<\u002Fsmall><\u002Fdiv>\n      <div class=\"title\">Apê na Pavão<\u002Fdiv>\n      <div class=\"addr\">\n        <svg class=\"icn\" viewBox=\"0 0 24 24\"><path d=\"M20 10c0 7-8 13-8 13s-8-6-8-13a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n        Moema · 5min metrô Eucaliptos\n      <\u002Fdiv>\n      <div class=\"specs\">\n        <span>\n          <svg class=\"icn\" viewBox=\"0 0 24 24\"><path d=\"M2 4v16\"><\u002Fpath><path d=\"M2 8h18a2 2 0 0 1 2 2v10\"><\u002Fpath><path d=\"M2 17h20\"><\u002Fpath><path d=\"M6 8v9\"><\u002Fpath><\u002Fsvg>\n          2 dorms\n        <\u002Fspan>\n        <span>\n          <svg class=\"icn\" viewBox=\"0 0 24 24\"><path d=\"M9 6 6.5 3.5a1.5 1.5 0 0 0-1-.5C4.683 3 4 3.683 4 4.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5h2\"><\u002Fpath><line x1=\"10\" x2=\"8\" y1=\"5\" y2=\"7\"><\u002Fline><line x1=\"2\" x2=\"22\" y1=\"12\" y2=\"12\"><\u002Fline><line x1=\"7\" x2=\"7\" y1=\"19\" y2=\"21\"><\u002Fline><line x1=\"17\" x2=\"17\" y1=\"19\" y2=\"21\"><\u002Fline><\u002Fsvg>\n          2 banhos\n        <\u002Fspan>\n        <span>\n          <svg class=\"icn\" viewBox=\"0 0 24 24\"><polyline points=\"15 3 21 3 21 9\"><\u002Fpolyline><polyline points=\"9 21 3 21 3 15\"><\u002Fpolyline><line x1=\"21\" x2=\"14\" y1=\"3\" y2=\"10\"><\u002Fline><line x1=\"3\" x2=\"10\" y1=\"21\" y2=\"14\"><\u002Fline><\u002Fsvg>\n          67 m²\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"tags\"><span class=\"tag tag-orange\">Mobiliado<\u002Fspan><span class=\"tag tag-purple\">Decorado<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"listing\">\n    <div class=\"photo alt\">\n      <div class=\"badge-row\">\n        <span class=\"badge\" style=\"background:var(--ape-purple);\">Novidade<\u002Fspan>\n        <span class=\"heart on\">\n          <svg class=\"icn icn-lg\" viewBox=\"0 0 24 24\" style=\"fill:currentColor;stroke:currentColor;\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <div class=\"price\">R$ 3.450<small> /mês<\u002Fsmall><\u002Fdiv>\n      <div class=\"title\">Apê na Aldebaran<\u002Fdiv>\n      <div class=\"addr\">\n        <svg class=\"icn\" viewBox=\"0 0 24 24\"><path d=\"M20 10c0 7-8 13-8 13s-8-6-8-13a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n        Moema · ao lado do Ibirapuera\n      <\u002Fdiv>\n      <div class=\"specs\">\n        <span>\n          <svg class=\"icn\" viewBox=\"0 0 24 24\"><path d=\"M2 4v16\"><\u002Fpath><path d=\"M2 8h18a2 2 0 0 1 2 2v10\"><\u002Fpath><path d=\"M2 17h20\"><\u002Fpath><path d=\"M6 8v9\"><\u002Fpath><\u002Fsvg>\n          1 dorm\n        <\u002Fspan>\n        <span>\n          <svg class=\"icn\" viewBox=\"0 0 24 24\"><path d=\"M9 6 6.5 3.5a1.5 1.5 0 0 0-1-.5C4.683 3 4 3.683 4 4.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5h2\"><\u002Fpath><line x1=\"10\" x2=\"8\" y1=\"5\" y2=\"7\"><\u002Fline><line x1=\"2\" x2=\"22\" y1=\"12\" y2=\"12\"><\u002Fline><line x1=\"7\" x2=\"7\" y1=\"19\" y2=\"21\"><\u002Fline><line x1=\"17\" x2=\"17\" y1=\"19\" y2=\"21\"><\u002Fline><\u002Fsvg>\n          1 banho\n        <\u002Fspan>\n        <span>\n          <svg class=\"icn\" viewBox=\"0 0 24 24\"><polyline points=\"15 3 21 3 21 9\"><\u002Fpolyline><polyline points=\"9 21 3 21 3 15\"><\u002Fpolyline><line x1=\"21\" x2=\"14\" y1=\"3\" y2=\"10\"><\u002Fline><line x1=\"3\" x2=\"10\" y1=\"21\" y2=\"14\"><\u002Fline><\u002Fsvg>\n          48 m²\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"tags\"><span class=\"tag tag-orange\">Mobiliado<\u002Fspan><span class=\"tag tag-purple\">Pet friendly<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fbody><\u002Fhtml>"
